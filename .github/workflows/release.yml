name: Release
on:
  push:
    tags:
      - "v*"
  # Callable by the auto-tag workflow (tag-on-version-bump.yml) via `uses:`, which
  # passes the tag explicitly. Calling directly (same run) sidesteps GitHub's rule
  # that a tag pushed by the default token cannot trigger the push-tags event above.
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.2 (defaults to the pushed tag)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      HAS_ROCKS_KEY: ${{ secrets.LUAROCKS_API_KEY != '' }}
      # The tag to release: the workflow_call input, else the pushed tag ref.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Validate tag matches init.lua version
        run: lua scripts/check-version.lua "${TAG}"
      - name: Run test suite
        run: lua spec/run.lua
      - name: Build single-file omelette
        run: |
          mkdir -p dist
          lua build/amalgamate.lua > dist/omelette
          chmod +x dist/omelette
      - name: Smoke-test the artifact
        run: lua dist/omelette build spec/fixtures/hello.egg | grep -q "M.greet = greet"
      - name: Extract release notes
        run: lua scripts/changelog.lua "${TAG#v}" < CHANGELOG.md > RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: dist/omelette
      - name: Publish to LuaRocks
        if: ${{ env.HAS_ROCKS_KEY == 'true' && github.event.repository.private == false }}
        run: |
          VERSION="${TAG#v}"
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@TAG@/${TAG}/g" \
            rockspecs/omelette.rockspec.template > "omelette-${VERSION}-1.rockspec"
          luarocks upload "omelette-${VERSION}-1.rockspec" --api-key="${{ secrets.LUAROCKS_API_KEY }}"
