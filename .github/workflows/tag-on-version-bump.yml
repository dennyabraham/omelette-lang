name: Tag on version bump

# When omelette/init.lua's version changes on canon (i.e. a version-bump PR merges),
# create + push the matching vX.Y.Z tag if it doesn't exist yet, then run the release.
# The tag is pushed with the default token, which by design does NOT trigger release.yml's
# push-tags event; instead we invoke release.yml directly via `uses:` (same run), so
# exactly one release is produced. Manual `git tag` pushes still fire release.yml normally.
on:
  push:
    branches: [canon]
    paths:
      - "omelette/init.lua"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      created: ${{ steps.ver.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        name: Create the vX.Y.Z tag if the current version has none
        run: |
          VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' omelette/init.lua | head -1)
          if [ -z "$VERSION" ]; then echo "no version found in omelette/init.lua"; exit 1; fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "created and pushed $TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: ${{ needs.tag.outputs.created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
