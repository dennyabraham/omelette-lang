name: Pages
# Builds site/dist and deploys it to GitHub Pages on every push to canon (and on
# demand). Requires Pages enabled in repo settings with source = GitHub Actions.
# The site is assembled from both site/ and docs/guide.md, so we rebuild on any
# canon push rather than a path filter that could miss a guide edit.
on:
  push:
    branches: [canon]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write       # deploy permission
  id-token: write    # deploy permission (OIDC for actions/deploy-pages)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit"
      - name: Build site
        run: lua site/build.lua
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
